name: Gerar ISO Play Musica

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Preparar ferramentas
        run: |
          apt-get update
          apt-get install -y git ca-certificates live-build debootstrap xorriso squashfs-tools \
            syslinux syslinux-utils isolinux grub-pc-bin grub-efi-amd64-bin mtools dosfstools rsync

      - uses: actions/checkout@v4

      - name: Copiar o jukebox para dentro da ISO
        run: |
          mkdir -p iso/config/includes.chroot/opt/jukebox
          cp -a jukebox/. iso/config/includes.chroot/opt/jukebox/
          cd iso/config/includes.chroot/opt/jukebox
          rm -f INICIAR.bat atualizar.ps1 LEIA-ME.txt biblioteca.js
          mkdir -p musicas imagem som

      - name: Montar a ISO
        working-directory: iso
        run: |
          lb config
          lb build

      - name: Renomear
        run: |
          ls -lh iso/*.iso
          mv iso/*.iso PlayMusica.iso

      - uses: actions/upload-artifact@v4
        with:
          name: PlayMusica-ISO
          path: PlayMusica.iso
          compression-level: 0
